# The MCP endpoint is a plain function. Nothing here is stateful, so no
# background/edge machinery and no session store is required.
[build]
  command = "pnpm run build"
  publish = "public"
  # Explicit. With a publish dir set and no framework detected, the default
  # functions location is not picked up and the endpoint deploys as a 404.
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# No redirect for /mcp on purpose. The function exports `config.path = '/mcp'`
# (Functions API v2), so Netlify serves it there natively. Adding a rewrite to
# /.netlify/functions/mcp breaks it: that legacy path does not exist under v2
# routing, so the forced rewrite lands on a 404.

[[headers]]
  for = "/mcp"
  [headers.values]
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"
